events {
    worker_connections 1024;
}

http {
    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Taille max upload (photos, reçus)
    client_max_body_size 10M;

    # ─── HTTP → redirection HTTPS ──────────────────────────────
    server {
        listen 80;
        server_name _;

        # Nécessaire pour Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Rediriger tout le reste vers HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # Certificats SSL (générés par Certbot)
        ssl_certificate     /etc/letsencrypt/live/VOTRE_DOMAINE/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/VOTRE_DOMAINE/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # ── API REST ─────────────────────────────────────────
        location /api/ {
            proxy_pass         http://app:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # ── WebSocket (temps réel GPS) ───────────────────────
        location /ws {
            proxy_pass         http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
        }

        # ── Interface web ────────────────────────────────────
        location / {
            proxy_pass       http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
