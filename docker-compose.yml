version: '3.9'

services:

  # ─── Base de données PostgreSQL + TimescaleDB ───────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: oros_postgres
    restart: always
    environment:
      POSTGRES_DB:       ${DB_NAME:-oros_gps}
      POSTGRES_USER:     ${DB_USER:-oros}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oros_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oros}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - oros_net

  # ─── Cache Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: oros_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - oros_net

  # ─── Serveur GPS + API + Interface web ─────────────────────────
  app:
    build: .
    container_name: oros_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    ports:
      # Interface web + API
      - "3000:3000"
      # Ports TCP GPS
      - "8090:8090"    # GT06 — Sinotrack (port corrigé)
      - "5027:5027"    # Teltonika CODEC8/8E
      - "5013:5013"    # H02 / Seeworld
      - "8000:8000"    # Seeworld alternatif
      - "5002:5002"    # TK103 / Coban
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    networks:
      - oros_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Nginx reverse proxy + SSL automatique ─────────────────────
  nginx:
    image: nginx:alpine
    container_name: oros_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - oros_net

  # ─── Certbot pour SSL gratuit (Let's Encrypt) ──────────────────
  certbot:
    image: certbot/certbot
    container_name: oros_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  app_logs:
  certbot_www:
  certbot_conf:

networks:
  oros_net:
    driver: bridge
